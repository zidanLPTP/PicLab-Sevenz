name: CI PicLab Sevenz

on:
  push:
    branches:
      - main
      - 'tahap-*'
  pull_request:
    branches:
      - main
      - 'tahap-*'

jobs:
  frontend:
    name: Frontend (Lint, Uji, Bangun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Periksa kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan linting
        run: npm run lint

      - name: Jalankan pengujian unit (Vitest)
        run: npm test

      - name: Jalankan pembangunan produksi
        run: npm run build

  backend:
    name: Backend Python ${{ matrix.python-version }} (Lint, Uji, Audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Periksa kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan ruff (linter)
        run: ruff check .

      - name: Jalankan pytest
        run: pytest -v

      - name: Jalankan audit keamanan dependensi (pip-audit)
        run: pip-audit

  e2e:
    name: Pengujian E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Periksa kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi root dan frontend
        run: |
          npm ci
          cd frontend && npm ci && cd ..

      - name: Pasang peramban Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan pengujian Playwright E2E
        run: npx playwright test
